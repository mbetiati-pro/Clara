<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>Maria Clara | AI Chief Discovery Officer @ mbetiati.pro</title>
  <style>
    :root {
      --bg: #efe7de; --bar: #f7f4f0; --line: #e2dcd3; --txt: #111b21; --sub: #667781;
      --bolha-clara: #ffffff; --bolha-user: #d9fdd3; --campo: #ffffff; --menu: #ffffff;
    }
    body.escuro {
      --bg: #0b141a; --bar: #202c33; --line: #2a3942; --txt: #e9edef; --sub: #8696a0;
      --bolha-clara: #202c33; --bolha-user: #005c4b; --campo: #2a3942; --menu: #233138;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--txt); height: 100dvh; display: flex; flex-direction: column; }
    header { background: var(--bar); padding: 10px 12px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--line); position: relative; flex-shrink: 0; }
    #foto { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      background: #8a8378; display: block; cursor: pointer; }
    #visor { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 60;
      background: #0b141a; display: none; }
    #visor.aberto { display: flex; flex-direction: column; }
    #visorTopo { position: absolute; top: 0; left: 0; right: 0; z-index: 2;
      display: flex; align-items: center; gap: 20px; padding: 14px 16px; color: #e9edef;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0)); }
    #visorVoltar { background: none; border: none; color: #e9edef; cursor: pointer;
      padding: 0; line-height: 0; }
    #visorVoltar svg { width: 24px; height: 24px; display: block; }
    #visorNome { font-size: 17px; font-weight: 500; }
    #visorCorpo { flex: 1; display: flex; align-items: center; justify-content: center;
      overflow: hidden; padding: 0; }
    #visorImg { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    #ident { flex: 1; min-width: 0; }
    #nome-topo { font-size: 16px; font-weight: 600; }
    #cargo { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #pontos { background: none; border: none; color: var(--sub); font-size: 22px; cursor: pointer; padding: 0 6px; }
    #menu { position: absolute; top: 52px; right: 10px; background: var(--menu); border: 1px solid var(--line);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); display: none; z-index: 10; overflow: hidden; }
    #menu.aberto { display: block; }
    #menu button { display: block; width: 100%; text-align: left; background: none; border: none;
      color: var(--txt); padding: 12px 20px; font-size: 14px; cursor: pointer; white-space: nowrap; }
    #menu button:hover { background: var(--line); }
    #menu a { display: block; text-align: left; color: var(--txt); padding: 12px 20px;
      font-size: 14px; text-decoration: none; white-space: nowrap; }
    #menu a:hover { background: var(--line); }
    #menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
    #chat { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 78%; padding: 7px 11px; border-radius: 8px; line-height: 1.45; font-size: 15px;
      white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.08); }
    .clara { align-self: flex-start; background: var(--bolha-clara); border-top-left-radius: 2px; }
    .msg a { color: #027eb5; text-decoration: underline; word-break: break-all; }
    body.escuro .msg a { color: #53bdeb; }
    .msg { position: relative; }
    .meta { float: right; margin: 6px -4px -4px 10px; font-size: 11px; color: var(--sub);
      display: inline-flex; align-items: center; gap: 3px; line-height: 1; user-select: none; }
    .tick { width: 15px; height: 11px; display: inline-block; vertical-align: middle; }
    .tick svg { width: 100%; height: 100%; display: block; }
    .tick.lido svg { color: #53bdeb; }
    .tick:not(.lido) svg { color: var(--sub); }
    .divisor { align-self: center; background: var(--bar); color: var(--sub); font-size: 12px;
      padding: 5px 12px; border-radius: 8px; margin: 8px 0; box-shadow: 0 1px 1px rgba(0,0,0,0.06);
      letter-spacing: 0.2px; }
    #emoji { background: none; border: none; color: var(--sub); cursor: pointer;
      padding: 0 2px; line-height: 0; align-self: center; flex-shrink: 0; }
    #emoji svg { width: 26px; height: 26px; display: block; }
    #painelEmoji { position: absolute; bottom: 60px; left: 8px; right: 8px;
      background: var(--menu); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.22); display: none; z-index: 20; overflow: hidden; }
    #painelEmoji.aberto { display: block; }
    #emojiTopo { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border-bottom: 1px solid var(--line); }
    #emojiBusca { flex: 1; background: var(--campo); border: none; border-radius: 16px;
      padding: 7px 12px; font-size: 14px; color: var(--txt); outline: none; font-family: inherit; }
    #emojiTopo button { background: none; border: none; color: var(--sub); cursor: pointer;
      padding: 2px; line-height: 0; }
    #emojiTopo button svg { width: 21px; height: 21px; display: block; }
    #emojiGrade { max-height: 230px; overflow-y: auto; padding: 6px 8px 10px; }
    .emojiTitulo { font-size: 12px; color: var(--sub); text-transform: uppercase;
      letter-spacing: 0.4px; margin: 8px 4px 4px; }
    .emojiLinha { display: grid; grid-template-columns: repeat(8, 1fr); gap: 1px; }
    .emojiLinha button { background: none; border: none; font-size: 23px; cursor: pointer;
      padding: 5px 0; border-radius: 7px; line-height: 1.15; }
    .emojiLinha button:hover { background: var(--line); }
    #emojiAbas { display: flex; border-top: 1px solid var(--line); background: var(--bar); }
    #emojiAbas button { flex: 1; background: none; border: none; cursor: pointer;
      padding: 9px 0; color: var(--sub); line-height: 0; border-radius: 0; }
    #emojiAbas button svg { width: 20px; height: 20px; display: block; margin: 0 auto; }
    #emojiAbas button.ativa { color: #00a884; background: var(--line); }
    #emojiVazio { color: var(--sub); font-size: 13px; text-align: center; padding: 24px 10px; }
    .user { align-self: flex-end; background: var(--bolha-user); border-top-right-radius: 2px; }
    #cargo.digitando { color: #00a884; }
    .typing { align-self: flex-start; background: var(--bolha-clara); border-top-left-radius: 2px;
      padding: 11px 14px; box-shadow: 0 1px 1px rgba(0,0,0,0.08); display: inline-flex; gap: 4px; align-items: center; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--sub);
      display: inline-block; animation: digita 1.2s infinite ease-in-out; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes digita {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }
    #status { display: none; }
    footer { padding: 8px; display: flex; gap: 6px; align-items: flex-end; flex-shrink: 0; position: relative; }
    #input { flex: 1; padding: 11px 14px; border: none; border-radius: 22px; font-size: 15px;
      background: var(--campo); color: var(--txt); outline: none; resize: none; max-height: 110px;
      font-family: inherit; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    #send { background: #00a884; color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px;
      font-size: 17px; cursor: pointer; flex-shrink: 0; }
    #send:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <header>
    <img id="foto" src="clara.jpg" alt="Maria Clara" />
    <div id="ident">
      <div id="nome-topo">Maria Clara</div>
      <div id="cargo">AI Chief Discovery Officer @ mbetiati.pro</div>
    </div>
    <button id="pontos">&#8942;</button>
    <div id="menu">
      <button data-tema="claro">Visual Claro</button>
      <button data-tema="escuro">Visual Escuro</button>
      <button data-tema="sistema">Visual do Sistema</button>
      <button id="nova">Nova conversa</button>
      <div class="sep"></div>
      <a href="/privacidade" target="_blank" rel="noopener">Termo de Privacidade</a>
    </div>
  </header>
  <div id="visor">
    <div id="visorTopo">
      <button id="visorVoltar" type="button" title="Voltar">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div id="visorNome">Maria Clara</div>
    </div>
    <div id="visorCorpo">
      <img id="visorImg" src="clara.jpg" alt="Maria Clara" />
    </div>
  </div>
  <div id="chat"></div>
  <div id="status"></div>
  <footer>
    <div id="painelEmoji">
      <div id="emojiTopo">
        <button id="emojiLupa" title="Buscar" type="button"></button>
        <input id="emojiBusca" type="text" placeholder="Buscar emoji" />
        <button id="emojiApagar" title="Apagar" type="button"></button>
      </div>
      <div id="emojiGrade"></div>
      <div id="emojiAbas"></div>
    </div>
    <button id="emoji" title="Emojis" type="button"></button>
    <textarea id="input" rows="1" placeholder="Digite uma mensagem"></textarea>
    <button id="send">&#10148;</button>
  </footer>
  <script>
    var chat = document.getElementById("chat");
    var input = document.getElementById("input");
    var send = document.getElementById("send");
    var status = document.getElementById("status");
    var pontos = document.getElementById("pontos");
    var menu = document.getElementById("menu");
    var cargo = document.getElementById("cargo");
    var CARGO_ORIGINAL = cargo.textContent;
    var CHAVE = "clara_conversa";
    var messages = [];
    var conversaId = "";
    var briefingEnviado = false;
    var analiseAgendada = false;

    // ---- origem: de onde essa pessoa chegou ----
    // /palco, /totem e /nfc caem no mesmo index.html via rewrite no vercel.json.
    // A URL nao muda, entao o caminho identifica a porta de entrada.
    // Vale o primeiro toque: quem entrou pelo totem continua totem se voltar depois.
    var CHAVE_ORIGEM = "clara_origem";
    var PORTAS = { "/palco": "palco", "/totem": "totem", "/nfc": "nfc" };

    function detectarOrigem() {
      var caminho = location.pathname.replace(/\/+$/, "").toLowerCase();
      var nova = PORTAS[caminho] || "";
      if (!nova) {
        try {
          var p = new URLSearchParams(location.search);
          nova = (p.get("origem") || p.get("utm_source") || "").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 24);
        } catch (e) {}
      }
      var salva = "";
      try { salva = localStorage.getItem(CHAVE_ORIGEM) || ""; } catch (e) {}
      if (nova && !salva) {
        try { localStorage.setItem(CHAVE_ORIGEM, nova); } catch (e) {}
        salva = nova;
      }
      return salva || nova || "direto";
    }
    var origem = detectarOrigem();

    function novoId() {
      try { return crypto.randomUUID(); }
      catch (e) { return "c" + Date.now() + Math.random().toString(16).slice(2); }
    }
    function salvarLocal() {
      try { localStorage.setItem(CHAVE, JSON.stringify({ id: conversaId, messages: messages, briefingEnviado: briefingEnviado, analiseAgendada: analiseAgendada })); } catch (e) {}
    }
    function carregarLocal() {
      try { return JSON.parse(localStorage.getItem(CHAVE)); } catch (e) { return null; }
    }
    function aplicarTema(t) {
      if (t === "sistema") {
        document.body.classList.toggle("escuro", window.matchMedia("(prefers-color-scheme: dark)").matches);
      } else {
        document.body.classList.toggle("escuro", t === "escuro");
      }
      try { localStorage.setItem("tema", t); } catch (e) {}
    }
    aplicarTema(localStorage.getItem("tema") || "sistema");

    pontos.addEventListener("click", function (e) { e.stopPropagation(); menu.classList.toggle("aberto"); });
    document.addEventListener("click", function () { menu.classList.remove("aberto"); });
    var temaBtns = menu.querySelectorAll("button[data-tema]");
    for (var i = 0; i < temaBtns.length; i++) {
      (function (b) {
        b.addEventListener("click", function () { aplicarTema(b.dataset.tema); menu.classList.remove("aberto"); });
      })(temaBtns[i]);
    }
    document.getElementById("nova").addEventListener("click", function () {
      if (!confirm("Comecar uma conversa nova? A atual sera apagada deste aparelho.")) return;
      try { localStorage.removeItem(CHAVE); } catch (e) {}
      location.reload();
    });

    var foto = document.getElementById("foto");
    var visor = document.getElementById("visor");
    var visorImg = document.getElementById("visorImg");
    function abrirVisor() {
      if (visor.classList.contains("aberto")) return;
      visor.classList.add("aberto");
      menu.classList.remove("aberto");
      try { history.pushState({ visor: 1 }, ""); } catch (e) {}
    }
    function fecharVisor(usarHistorico) {
      if (!visor.classList.contains("aberto")) return;
      visor.classList.remove("aberto");
      if (usarHistorico !== false) {
        try { if (history.state && history.state.visor) { history.back(); } } catch (e) {}
      }
    }
    foto.addEventListener("click", function (e) { e.stopPropagation(); abrirVisor(); });
    document.getElementById("visorVoltar").addEventListener("click", function () { fecharVisor(); });
    document.getElementById("visorCorpo").addEventListener("click", function () { fecharVisor(); });
    visorImg.addEventListener("click", function (e) { e.stopPropagation(); });
    window.addEventListener("popstate", function () { fecharVisor(false); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { fecharVisor(); }
    });

    function escaparHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function linkificar(texto) {
      var t = escaparHtml(texto);
      // Links http/https viram clicaveis (abrem em nova aba)
      t = t.replace(/(https?:\/\/[^\s<]+)/g, function (u) {
        var fim = "";
        var m = u.match(/[.,;:!?)]+$/);
        if (m) { fim = m[0]; u = u.slice(0, -fim.length); }
        return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + "</a>" + fim;
      });
      // WhatsApp (+55 ...) vira link wa.me
      t = t.replace(/\+?55\s?\(?\d{2}\)?\s?9?\d{4}-?\d{4}/g, function (tel) {
        var digitos = tel.replace(/\D/g, "");
        if (digitos.length < 12 || digitos.length > 13) { return tel; }
        return '<a href="https://wa.me/' + digitos + '" target="_blank" rel="noopener noreferrer">' + tel + "</a>";
      });
      return t;
    }
    // ---- hora, data e checks (estilo WhatsApp) ----
    function horaDe(ts) {
      var d = new Date(ts);
      return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    }
    function diaDe(ts) {
      var d = new Date(ts);
      return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    }
    var DIAS_SEMANA = ["Domingo", "Segunda-Feira", "Ter\u00e7a-Feira", "Quarta-Feira",
      "Quinta-Feira", "Sexta-Feira", "S\u00e1bado"];
    var MESES = ["janeiro", "fevereiro", "mar\u00e7o", "abril", "maio", "junho",
      "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
    function rotuloDia(ts) {
      var d = new Date(ts);
      var hoje = new Date();
      var zera = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
      var diff = Math.round((zera(hoje) - zera(d)) / 86400000);
      if (diff === 0) return "Hoje";
      if (diff === 1) return "Ontem";
      if (diff > 1 && diff < 7) return DIAS_SEMANA[d.getDay()];
      return d.getDate() + " de " + MESES[d.getMonth()] + " de " + d.getFullYear();
    }
    var ultimoDiaNaTela = "";
    function garantirDivisor(ts) {
      var dia = diaDe(ts);
      if (dia === ultimoDiaNaTela) return;
      ultimoDiaNaTela = dia;
      var div = document.createElement("div");
      div.className = "divisor";
      div.textContent = rotuloDia(ts);
      chat.appendChild(div);
    }
    var SVG_UM = '<svg viewBox="0 0 16 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.6 10.2 1.2 5.8l1.1-1.1 3.3 3.3L13.2.6l1.1 1.1z" fill="currentColor"/></svg>';
    var SVG_DOIS = '<svg viewBox="0 0 20 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.3 10.2.9 5.8 2 4.7l3.3 3.3L12.9.6 14 1.7z" fill="currentColor"/><path d="M10.6 10.2 6.2 5.8l1.1-1.1 3.3 3.3L18.2.6l1.1 1.1z" fill="currentColor"/></svg>';
    var SVG_RELOGIO = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.4V8l2.6 1.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';

    function montarMeta(ts, who) {
      var meta = document.createElement("span");
      meta.className = "meta";
      var hora = document.createElement("span");
      hora.textContent = horaDe(ts);
      meta.appendChild(hora);
      if (who === "user") {
        var tick = document.createElement("span");
        tick.className = "tick";
        tick.innerHTML = SVG_RELOGIO;
        meta.appendChild(tick);
      }
      return meta;
    }
    // Estados: relogio (enviando) -> 1 check (enviado) -> 2 checks cinza (entregue) -> 2 checks azuis (lido)
    function marcarEntregue(bolha) {
      var t = bolha ? bolha.querySelector(".tick") : null;
      if (!t) return;
      t.innerHTML = SVG_UM;
      setTimeout(function () { t.innerHTML = SVG_DOIS; }, 500);
    }
    function marcarTudoLido() {
      var ticks = chat.querySelectorAll(".user .tick");
      for (var i = 0; i < ticks.length; i++) {
        ticks[i].innerHTML = SVG_DOIS;
        ticks[i].classList.add("lido");
      }
    }

    function addBubbleUnico(texto, who, ts) {
      ts = ts || Date.now();
      garantirDivisor(ts);
      var div = document.createElement("div");
      div.className = "msg " + who;
      var corpo = document.createElement("span");
      corpo.innerHTML = linkificar(texto);
      div.appendChild(corpo);
      div.appendChild(montarMeta(ts, who));
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }
    function partirEmBlocos(text) {
      var partes = String(text).split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
      return partes.length ? partes : [String(text)];
    }
    function addBubble(text, who, ts) {
      var blocos = partirEmBlocos(text);
      var ultimo = null;
      blocos.forEach(function (parte) { ultimo = addBubbleUnico(parte, who, ts); });
      return ultimo;
    }
    function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    // Em celular/tablet o foco abre o teclado virtual e come metade da tela.
    // So devolve o foco automaticamente onde o teclado e fisico (desktop).
    var TECLADO_VIRTUAL = false;
    try {
      TECLADO_VIRTUAL = window.matchMedia("(pointer: coarse)").matches
        || ("ontouchstart" in window && window.innerWidth < 1180);
    } catch (e) { TECLADO_VIRTUAL = false; }
    function focarSePuder() {
      if (TECLADO_VIRTUAL) return;
      try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
    }

    // Tempo de "digitando" proporcional ao tamanho da mensagem.
    // Humano real digita ~250 ms/letra; aqui uso 35 ms/letra pra simular sem travar a tela.
    function tempoDigitando(texto) {
      var BASE = 500;      // batida inicial (ela viu e comecou a digitar)
      var POR_LETRA = 35;  // ms por caractere
      var MIN = 700;
      var MAX = 2200;
      var t = BASE + String(texto).length * POR_LETRA;
      return Math.max(MIN, Math.min(MAX, t));
    }

    function criarBolhaDigitando() {
      var div = document.createElement("div");
      div.className = "msg typing";
      div.innerHTML = "<span></span><span></span><span></span>";
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }
    function mostrarDigitando() {
      marcarTudoLido();
      cargo.textContent = "digitando...";
      cargo.classList.add("digitando");
      return criarBolhaDigitando();
    }
    function esconderDigitando(bolha) {
      if (bolha) bolha.remove();
      cargo.textContent = CARGO_ORIGINAL;
      cargo.classList.remove("digitando");
    }

    async function abrirConversa() {
      var baloes = [
        "Ol\u00e1! Tudo bom?",
        "Eu me chamo Maria Clara, sou uma IA, s\u00f3cia do Marcos Betiati.",
        "Atualmente tamb\u00e9m sou AI Chief Discovery Officer da mbetiati.pro",
        "Antes da gente come\u00e7ar... como voc\u00ea se chama?"
      ];
      for (var i = 0; i < baloes.length; i++) {
        var t = mostrarDigitando();
        await esperar(tempoDigitando(baloes[i]));
        esconderDigitando(t);
        var agora = Date.now();
        addBubbleUnico(baloes[i], "clara", agora);
        messages.push({ role: "assistant", content: baloes[i], t: agora });
        await esperar(320);
      }
      salvarLocal();
      focarSePuder();
    }

    // ---- dossie: cadencia enxuta ----
    // Antes: rodava a cada resposta da Clara (cerca de 30 chamadas por conversa).
    // Agora: quando a conversa fica parada, quando a pessoa sai da aba,
    // e na hora em que a Clara manda o link de pagamento.
    var TEMPO_OCIOSO_DOSSIE = 90000;   // 90 segundos sem atividade: salva o dossie
    var TEMPO_ENCERRANDO = 480000;     // 8 minutos sem atividade: conversa acabou
    var timerDossie = null;
    var timerEncerrando = null;
    var dossieEnviando = false;
    var dossieUltimoTamanho = 0;

    function agendarDossie() {
      if (timerDossie) clearTimeout(timerDossie);
      timerDossie = setTimeout(function () {
        timerDossie = null;
        salvarDossie(false);
      }, TEMPO_OCIOSO_DOSSIE);

      // Segundo relogio, bem mais longo. Se a pessoa sumiu de vez com a aba
      // aberta, e a hora de tratar a conversa como encerrada e liberar a analise.
      if (timerEncerrando) clearTimeout(timerEncerrando);
      timerEncerrando = setTimeout(function () {
        timerEncerrando = null;
        salvarDossie(true);
      }, TEMPO_ENCERRANDO);
    }

    // Gatilhos que NAO dependem do fim da conversa.
    // O fim e o momento mais fragil que existe: aba fechando, tela travando,
    // app sendo morto pelo sistema. O lead precisa entrar antes disso.
    var contatoGravado = false;
    var ultimaGravacaoAuto = 0;
    var PADRAO_EMAIL = /[^\s@]+@[^\s@.]+\.[a-z]{2,}/i;

    function gatilhosDeGravacao(texto) {
      // O lead passa a existir no instante em que a pessoa entrega o e-mail.
      // Espera um pouco pra Clara confirmar e grava com a pagina viva.
      if (!contatoGravado && PADRAO_EMAIL.test(texto)) {
        contatoGravado = true;
        ultimaGravacaoAuto = messages.length;
        setTimeout(function () { salvarDossie(false); }, 8000);
        return;
      }
      // Rede de seguranca: a cada 10 mensagens novas desde a ultima gravacao.
      // Conta por DIFERENCA, nao por resto de divisao. Esta funcao so roda
      // logo depois de uma mensagem da pessoa, e nesse instante o array tem
      // sempre tamanho impar (a conversa abre com 4 baloes e depois alterna),
      // entao testar multiplo de 10 nunca daria verdadeiro.
      if (messages.length - ultimaGravacaoAuto >= 10) {
        ultimaGravacaoAuto = messages.length;
        salvarDossie(false);
      }
    }

    function precisaSalvarDossie(encerrando) {
      if (messages.length < 6) return false;
      // No encerramento vale reenviar mesmo sem mensagem nova: e o unico
      // momento em que a analise da pessoa pode ser agendada.
      if (encerrando && !analiseAgendada && messages.length >= 8) return true;
      if (messages.length === dossieUltimoTamanho) return false;
      return true;
    }

    async function salvarDossie(encerrando) {
      if (!precisaSalvarDossie(encerrando) || dossieEnviando) return;
      dossieEnviando = true;
      var tamanhoNoEnvio = messages.length;
      try {
        var res = await fetch("/api/dossie", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: messages,
            id: conversaId,
            briefingEnviado: briefingEnviado,
            analiseAgendada: analiseAgendada,
            encerrando: encerrando === true,
            origem: origem
          })
        });
        var data = await res.json();
        if (data && data.ok) { dossieUltimoTamanho = tamanhoNoEnvio; }
        if (data && (data.briefingEnviado || data.analiseAgendada)) {
          if (data.briefingEnviado) briefingEnviado = true;
          if (data.analiseAgendada) analiseAgendada = true;
          salvarLocal();
        }
        status.textContent = (data && data.ok) ? "salvo" : "erro ao salvar";
      } catch (err) {
        status.textContent = "erro ao salvar";
      }
      dossieEnviando = false;
    }

    // Ao fechar ou minimizar a aba: manda de uma vez so, sem esperar resposta.
    // Este e o sinal mais confiavel de que a conversa acabou, entao vai com
    // encerrando = true e a analise da pessoa pode ser agendada aqui.
    function salvarDossieAoSair() {
      // Se uma gravacao ja esta em voo (tipico depois do link de pagamento),
      // nao dispare outra: as duas chegariam juntas no servidor e virariam
      // duas linhas na planilha com o mesmo ID.
      if (dossieEnviando) return;
      if (!precisaSalvarDossie(true)) return;
      var corpo = JSON.stringify({
        messages: messages,
        id: conversaId,
        briefingEnviado: briefingEnviado,
        analiseAgendada: analiseAgendada,
        encerrando: true,
        origem: origem
      });

      // Caminho principal: fetch com keepalive. Sobrevive a pagina sendo
      // descarregada E devolve resposta, entao da pra saber se gravou mesmo.
      // O contador so avanca com o ok do servidor - antes ele avancava so
      // porque o sendBeacon aceitou enfileirar, o que mascarava a falha e
      // ainda travava a proxima tentativa.
      try {
        fetch("/api/dossie", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: corpo,
          keepalive: true
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.ok) { dossieUltimoTamanho = messages.length; }
            if (data && (data.briefingEnviado || data.analiseAgendada)) {
              if (data.briefingEnviado) briefingEnviado = true;
              if (data.analiseAgendada) analiseAgendada = true;
              salvarLocal();
            }
          })
          .catch(function () {});
        return;
      } catch (e) {}

      // Ultimo recurso, se o navegador nao aceitar keepalive.
      try {
        var pacote = new Blob([corpo], { type: "application/json" });
        if (navigator.sendBeacon) { navigator.sendBeacon("/api/dossie", pacote); }
      } catch (e) {}
    }
    // ------------------------------------------------------------------
    // Volta do checkout do Asaas.
    // Quem confirma pagamento e o webhook, nunca o retorno da guia: no cartao
    // a cobranca pode cair em analise de risco e ser recusada depois. Por isso
    // aqui a gente PERGUNTA ao servidor em vez de assumir que deu certo.
    // ------------------------------------------------------------------
    var ZAP_MARCOS = "+55 11 97822-6365";

    // Passa pelo "digitando" e pela mesma cadencia das outras respostas.
    // Sem isso a mensagem aparece do nada, e justo no momento em que a pessoa
    // acabou de pagar e esta prestando atencao na tela.
    async function falaDaClara(texto) {
      var bolha = mostrarDigitando();
      await esperar(tempoDigitando(texto));
      esconderDigitando(bolha);
      var agora = Date.now();
      addBubble(texto, "clara", agora);
      messages.push({ role: "assistant", content: texto, t: agora });
      salvarLocal();
    }

    async function consultarPagamento() {
      try {
        var r = await fetch("/api/status?id=" + encodeURIComponent(conversaId));
        var d = await r.json();
        if (d && d.ok) return String(d.pago || "");
      } catch (e) {}
      return "";
    }

    async function linkNovoDePagamento() {
      try {
        var r = await fetch("/api/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: conversaId, origem: origem })
        });
        var d = await r.json();
        if (d && d.ok && d.link) return d.link;
      } catch (e) {}
      return "";
    }

    async function ofereceLinkNovo(primeiroBalao) {
      await falaDaClara(primeiroBalao);
      var link = await linkNovoDePagamento();
      if (link) {
        await falaDaClara("Mas fique tranquilo, acesse novamente o " + link
          + " para refazer o seu pagamento via Pix ou Cart\u00e3o.");
      } else {
        await falaDaClara("Me avisa por aqui que eu gero um link novo pra voc\u00ea.");
      }
    }

    function avisoPagamentoRecebido() {
      return "Muito obrigada, acabei de receber o seu pagamento. Em breve, o Marcos ("
        + ZAP_MARCOS + ") entrar\u00e1 em contato com voc\u00ea atrav\u00e9s do WhatsApp.";
    }

    async function tratarVoltaDoPagamento(situacao) {
      if (situacao === "cancel" || situacao === "exp") {
        await ofereceLinkNovo("Vi que o pagamento n\u00e3o foi conclu\u00eddo.");
        return;
      }

      // pg=ok: a pessoa terminou o fluxo, mas quem diz se o dinheiro caiu e o
      // webhook, nunca o retorno da guia.
      //
      // FASE 1 - resposta rapida. A pessoa esta olhando a tela AGORA; deixar
      // ela em silencio e o jeito mais certo de perde-la. No maximo 10s aqui.
      var limiteRapido = Date.now() + 10000;
      while (Date.now() < limiteRapido) {
        var pago = await consultarPagamento();
        if (pago === "SIM") { await falaDaClara(avisoPagamentoRecebido()); return; }
        if (pago === "RECUSADO") {
          await ofereceLinkNovo("Ops! Parece que seu pagamento foi recusado pelo banco.");
          return;
        }
        await esperar(1500);
      }

      // Nao confirmou a tempo: avisa com honestidade em vez de fazer a pessoa esperar.
      await falaDaClara("Muito obrigada! O pagamento est\u00e1 em confirma\u00e7\u00e3o e costuma levar poucos minutos. "
        + "Assim que entrar, o Marcos (" + ZAP_MARCOS + ") te chama no WhatsApp.");

      // FASE 2 - segue conferindo em silencio por mais 2 minutos. Se o dinheiro
      // cair enquanto a pessoa ainda estiver na tela, ela recebe a boa noticia
      // na hora em vez de ficar na duvida.
      var limiteLongo = Date.now() + 120000;
      while (Date.now() < limiteLongo) {
        await esperar(5000);
        var depois = await consultarPagamento();
        if (depois === "SIM") { await falaDaClara(avisoPagamentoRecebido()); return; }
        if (depois === "RECUSADO") {
          await ofereceLinkNovo("Ops! O seu banco acabou recusando o pagamento.");
          return;
        }
      }
    }

    (function verificarVoltaDoPagamento() {
      var p = new URLSearchParams(window.location.search).get("pg");
      if (!p) return;
      // Limpa a URL na hora: se a pessoa recarregar a pagina depois, a mensagem
      // nao pode aparecer de novo.
      try {
        window.history.replaceState({}, "", window.location.pathname);
      } catch (e) {}
      setTimeout(function () { tratarVoltaDoPagamento(p); }, 1200);
    })();

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") salvarDossieAoSair();
    });
    window.addEventListener("pagehide", salvarDossieAoSair);

    // Espera a pessoa terminar de mandar as bolhas antes de responder.
    // Se ela manda uma correcao logo em seguida, a Clara le tudo junto.
    var ESPERA_ANTES_DE_RESPONDER = 2200; // ms (ajustavel)
    var timerResposta = null;
    var respondendo = false;

    function sendMessage() {
      var text = input.value.trim();
      if (!text) return;
      input.value = "";
      input.style.height = "auto";
      var agora = Date.now();
      var bolha = addBubbleUnico(text, "user", agora);
      setTimeout(function () { marcarEntregue(bolha); }, 450);
      messages.push({ role: "user", content: text, t: agora });
      salvarLocal();
      agendarResposta();
      agendarDossie();
      gatilhosDeGravacao(text);
    }

    function agendarResposta() {
      if (timerResposta) clearTimeout(timerResposta);
      timerResposta = setTimeout(function () {
        timerResposta = null;
        if (!respondendo) responder();
      }, ESPERA_ANTES_DE_RESPONDER);
    }

    async function responder() {
      // so responde se houver mensagem do usuario pendente
      if (!messages.length || messages[messages.length - 1].role !== "user") return;
      respondendo = true;
      send.disabled = true;
      var inicio = Date.now();
      var typing = mostrarDigitando();
      var houveFalha = false;
      try {
        var res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: messages, id: conversaId, origem: origem })
        });
        var data = await res.json();
        if (data.reply) {
          // Primeiro balao: respeita a cadencia minima ja contando o tempo que a API levou
          var blocos = partirEmBlocos(data.reply);
          var alvo = tempoDigitando(blocos[0]);
          var jaEsperou = Date.now() - inicio;
          if (jaEsperou < alvo) await esperar(alvo - jaEsperou);
          esconderDigitando(typing);
          addBubbleUnico(blocos[0], "clara");
          // Demais baloes: digitando de novo entre cada um, como na abertura
          for (var b = 1; b < blocos.length; b++) {
            await esperar(320);
            var t2 = mostrarDigitando();
            await esperar(tempoDigitando(blocos[b]));
            esconderDigitando(t2);
            addBubbleUnico(blocos[b], "clara");
          }
          messages.push({ role: "assistant", content: data.reply });
          salvarLocal();
          // Fechou: link de pagamento na tela. Grava e dispara o briefing na hora.
          if (/asaas\.com\/(c\/|checkoutSession)/.test(String(data.reply))) {
            salvarDossie(true);
          } else {
            agendarDossie();
          }
        } else if (data.aviso) {
          // Recado da propria Clara quando a API nao respondeu.
          // NAO entra no historico: e transitorio, nao faz parte da conversa.
          houveFalha = true;
          esconderDigitando(typing);
          addBubble(data.aviso, "clara");
        } else {
          houveFalha = true;
          esconderDigitando(typing);
          addBubble("[erro] " + (data.error || "sem resposta"), "clara");
        }
      } catch (err) {
        houveFalha = true;
        esconderDigitando(typing);
        addBubble("[erro de conexao] " + err, "clara");
      }
      respondendo = false;
      send.disabled = false;
      focarSePuder();
      // se a pessoa mandou mais bolhas enquanto eu respondia, responde de novo.
      // nunca depois de falha, para nao entrar em loop de retentativa.
      if (!houveFalha && messages.length && messages[messages.length - 1].role === "user") {
        agendarResposta();
      }
    }

    var ABAS = [
      { id: "recentes", nome: "Recentes", ico: ICO.relogio },
      { id: "smileys", nome: "Smileys e pessoas", ico: ICO.carinha },
      { id: "natureza", nome: "Animais e natureza", ico: ICO.folha },
      { id: "comida", nome: "Comida e bebida", ico: ICO.xicara },
      { id: "atividades", nome: "Atividades", ico: ICO.bola },
      { id: "viagem", nome: "Viagens e lugares", ico: ICO.carro },
      { id: "objetos", nome: "Objetos", ico: ICO.lampada },
      { id: "simbolos", nome: "Simbolos", ico: ICO.nota },
      { id: "bandeiras", nome: "Bandeiras", ico: ICO.bandeira }
    ];

    function paraEmoji(codigo) {
      return codigo.split("-").map(function (p) {
        return String.fromCodePoint(parseInt(p, 16));
      }).join("");
    }
    function listaDaCat(id) {
      if (id === "recentes") return recentesEmoji();
      var s = EMOJI_CATS[id];
      return s ? s.split(" ") : [];
    }
    function recentesEmoji() {
      try {
        var r = JSON.parse(localStorage.getItem("clara_emoji_recentes") || "[]");
        return Array.isArray(r) ? r : [];
      } catch (e) { return []; }
    }
    function guardarRecente(codigo) {
      var r = recentesEmoji().filter(function (c) { return c !== codigo; });
      r.unshift(codigo);
      r = r.slice(0, 24);
      try { localStorage.setItem("clara_emoji_recentes", JSON.stringify(r)); } catch (e) {}
    }
    function inserirEmoji(codigo) {
      guardarRecente(codigo);
      input.value = input.value + paraEmoji(codigo);
      input.dispatchEvent(new Event("input"));
      input.focus({ preventScroll: true });
    }
    function montarGrade(titulo, codigos) {
      emojiGrade.innerHTML = "";
      if (!codigos.length) {
        emojiGrade.innerHTML = '<div id="emojiVazio">Nada por aqui ainda.</div>';
        return;
      }
      var h = document.createElement("div");
      h.className = "emojiTitulo";
      h.textContent = titulo;
      emojiGrade.appendChild(h);
      var linha = document.createElement("div");
      linha.className = "emojiLinha";
      codigos.forEach(function (c) {
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = paraEmoji(c);
        b.addEventListener("click", function (ev) { ev.stopPropagation(); inserirEmoji(c); });
        linha.appendChild(b);
      });
      emojiGrade.appendChild(linha);
      emojiGrade.scrollTop = 0;
    }
    var abaAtiva = "smileys";
    function abrirAba(id) {
      abaAtiva = id;
      emojiBusca.value = "";
      var aba = ABAS.filter(function (a) { return a.id === id; })[0];
      montarGrade(aba.nome, listaDaCat(id));
      var bts = emojiAbas.querySelectorAll("button");
      for (var i = 0; i < bts.length; i++) {
        bts[i].classList.toggle("ativa", bts[i].dataset.id === id);
      }
    }
    ABAS.forEach(function (a) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.id = a.id;
      b.title = a.nome;
      b.innerHTML = a.ico;
      b.addEventListener("click", function (ev) { ev.stopPropagation(); abrirAba(a.id); });
      emojiAbas.appendChild(b);
    });
    document.getElementById("emojiLupa").innerHTML = ICO.lupa;
    document.getElementById("emojiApagar").innerHTML = ICO.apagar;
    document.getElementById("emojiLupa").addEventListener("click", function (e) {
      e.stopPropagation(); emojiBusca.focus();
    });
    document.getElementById("emojiApagar").addEventListener("click", function (e) {
      e.stopPropagation();
      var v = Array.from(input.value);
      v.pop();
      input.value = v.join("");
      input.dispatchEvent(new Event("input"));
    });
    emojiBusca.addEventListener("input", function () {
      var termo = emojiBusca.value.trim().toLowerCase();
      if (!termo) { abrirAba(abaAtiva); return; }
      var achados = [];
      ABAS.forEach(function (a) {
        if (a.id === "recentes") return;
        if (a.nome.toLowerCase().indexOf(termo) !== -1) {
          achados = achados.concat(listaDaCat(a.id));
        }
      });
      montarGrade("Resultados", achados.slice(0, 120));
    });
    emojiBusca.addEventListener("click", function (e) { e.stopPropagation(); });

    function alternarPainel() {
      var abrindo = !painelEmoji.classList.contains("aberto");
      painelEmoji.classList.toggle("aberto", abrindo);
      btnEmoji.innerHTML = abrindo ? ICO.teclado : ICO.carinha;
      if (abrindo) { abrirAba(recentesEmoji().length ? "recentes" : "smileys"); }
      else { focarSePuder(); }
    }
    btnEmoji.innerHTML = ICO.carinha;
    btnEmoji.addEventListener("click", function (e) { e.stopPropagation(); alternarPainel(); });
    painelEmoji.addEventListener("click", function (e) { e.stopPropagation(); });
    function fecharPainel() {
      if (!painelEmoji.classList.contains("aberto")) return;
      painelEmoji.classList.remove("aberto");
      btnEmoji.innerHTML = ICO.carinha;
    }
    document.addEventListener("click", fecharPainel);
    input.addEventListener("focus", fecharPainel);

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    input.addEventListener("input", function () {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 110) + "px";
      // Se ha texto no campo, a pessoa esta compondo: segura a resposta.
      // Se o campo esvaziou (ela enviou ou apagou) e ha mensagem pendente, reinicia a contagem.
      if (input.value.trim() !== "") {
        if (timerResposta) { clearTimeout(timerResposta); timerResposta = null; }
      } else if (!respondendo && messages.length && messages[messages.length - 1].role === "user") {
        agendarResposta();
      }
    });

    function ajustarAltura() {
      var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.body.style.height = h + "px";
      chat.scrollTop = chat.scrollHeight;
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", ajustarAltura);
      window.visualViewport.addEventListener("scroll", ajustarAltura);
    }
    window.addEventListener("resize", ajustarAltura);
    input.addEventListener("focus", function () { setTimeout(ajustarAltura, 300); });
    ajustarAltura();

    var salvo = carregarLocal();
    if (salvo && salvo.messages && salvo.messages.length) {
      conversaId = salvo.id || novoId();
      messages = salvo.messages;
      briefingEnviado = salvo.briefingEnviado === true;
      analiseAgendada = salvo.analiseAgendada === true;
      dossieUltimoTamanho = messages.length;
      for (var j = 0; j < messages.length; j++) {
        addBubble(messages[j].content, messages[j].role === "assistant" ? "clara" : "user", messages[j].t);
      }
      marcarTudoLido();
      chat.scrollTop = chat.scrollHeight;
    } else {
      conversaId = novoId();
      abrirConversa();
    }
  </script>
